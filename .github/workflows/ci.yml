# GitHub Actions 화면에 표시할 자동 작업 이름.
# 테스트를 실행하고, main에서는 앱 이미지를 빌드하여 GHCR에 업로드한다.
name: Test and build

# 자동 작업을 언제 시작할지 정하는 조건.
# 아래 조건 중 하나만 충족돼도 실행한다.
on:
  # main에 커밋이 올라오면 실행한다.
  # PR을 병합해서 main이 바뀌는 경우도 포함한다.
  # 이 설정 자체가 main에 코드를 푸시하는 것은 아니다.
  push:
    branches:
      - main

  # main으로 합치려는 PR이 열리거나,
  # 그 PR의 출발 브랜치에 새 커밋이 올라오면 실행한다.
  # 여기서 main은 출발 브랜치가 아니라 병합 대상 브랜치다.
  # PR을 자동 생성하거나 자동 병합하는 설정은 아니다.
  pull_request:
    branches:
      - main

  # GitHub Actions 화면에서 사람이 수동 실행할 수 있게 한다.
  # 아래가 비어 있어도 활성화된 것이다.
  # 실행 전에 사람이 입력할 추가 항목이 없다는 뜻이다.
  workflow_dispatch:

# 이 워크플로에 제공되는 GITHUB_TOKEN의 권한을 정한다.
# GITHUB_TOKEN은 자동 작업이 GitHub에 접근할 때 쓰는 임시 인증 수단이다.
# 내 개인 계정의 권한을 바꾸는 설정은 아니다.
permissions:
  # 저장소 코드와 파일을 읽을 수 있게 한다.
  # 아래 checkout 작업이 코드를 가져올 때 사용한다.
  # 코드 수정·푸시를 허용하는 write 권한은 주지 않는다.
  contents: read

# 실제로 실행할 작업 묶음(Job)을 정의한다.
# 여기에 정의하는 Job은 Kubernetes Job과는 별개 개념이다.
jobs:
  # 이 작업 묶음의 식별자.
  # 나중에 이미지 빌드 작업이 "test 성공 후 실행"하도록 참조할 수 있다.
  test:
    # GitHub가 제공하는 Ubuntu 실행 환경에서 작업한다.
    # 내 맥이나 팀 서버에서 실행하는 것이 아니다.
    # ubuntu-latest가 가리키는 Ubuntu 버전은 시간이 지나면 바뀔 수 있다.
    runs-on: ubuntu-latest

    # 이 Job 전체의 실행 시간을 최대 15분으로 제한한다.
    # 패키지 설치와 테스트를 모두 포함하며,
    # 제한 시간을 넘기면 GitHub Actions가 작업을 취소한다.
    timeout-minutes: 15

    # 이 Job 안에서 실행할 단계들.
    # 위에서 아래 순서로 실행하며, 앞 단계가 실패하면
    # 뒤의 일반 단계는 기본적으로 실행하지 않는다.
    steps:
      # GitHub 실행 환경으로 저장소 코드를 가져오는 단계.
      # 아래 name은 실행 화면에서 사람이 읽을 설명이다.
      - name: 저장소 코드 가져오기

        # 이미 만들어진 재사용 작업(Action)을 호출한다.
        # actions/checkout은 저장소 코드를 가져오는 공식 Action이다.
        # @v7은 사용할 Action의 버전이며 Python 버전과는 관계없다.
        # PR 실행에서는 기본적으로 GitHub가 준비한 병합 검사용 코드를 가져온다.
        uses: actions/checkout@v7

      # 이후 단계에서 사용할 Python 환경을 준비한다.
      - name: Python 준비
        uses: actions/setup-python@v7

        # 이 Action에 전달하는 설정값.
        with:
          # 기존 Dockerfile과 같은 Python 3.12 계열을 사용한다.
          # 3.12.x 중 정확한 패치 버전까지 고정한 설정은 아니다.
          python-version: "3.12"

          # pip 다운로드 캐시를 저장·재사용해서
          # 다음 실행에서 패키지 설치 시간을 줄인다.
          # 캐시가 있어도 아래 pip install 단계는 필요하다.
          cache: pip

          # requirements.txt의 내용을 캐시 구분 기준으로 사용한다.
          # 파일 내용이 바뀌면 캐시 키도 달라진다.
          cache-dependency-path: requirements.txt

      # 프로젝트에 필요한 Python 패키지를 설치한다.
      - name: 필요한 패키지 설치

        # 준비한 Python의 pip를 실행한다.
        # -r은 지정한 파일에 적힌 패키지 목록을 읽으라는 뜻이다.
        # 패키지 버전 조건은 requirements.txt의 설정을 따른다.
        run: python -m pip install -r requirements.txt

      # 프로젝트의 자동 테스트를 실행한다.
      - name: 테스트 실행

        # 준비한 Python으로 pytest를 실행한다.
        # -q는 출력량을 줄여 결과를 간결하게 보여 준다.
        # 이 프로젝트는 pyproject.toml 설정에 따라 tests 폴더를 검사한다.
        # 테스트가 실패하면 이 단계와 test Job도 실패로 표시된다.
        run: python -m pytest -q
  # 테스트 통과 후 앱 이미지를 만드는 작업.
  build:
    # test Job이 성공해야 실행한다.
    needs: test

    # main 브랜치에서 실행된 경우만 진행한다.
    # PR 검사에서는 이미지 게시 작업을 실행하지 않는다.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 이 build Job에만 이미지 업로드 권한을 준다.
    permissions:
      contents: read
      packages: write

    steps:
      # Job마다 실행 환경이 별개이므로 코드를 다시 가져온다.
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7

            # 이미지를 저장할 주소와 버전 태그를 정한다.
      - name: 이미지 이름과 태그 설정
        id: image
        shell: bash
        run: |
          # 현재 저장소 이름을 가져와 소문자로 바꾼다.
          # 예: CCCR-TeamProj-02/edr-ai-triage-lab
          #  → cccr-teamproj-02/edr-ai-triage-lab
          # 컨테이너 이미지 경로는 소문자를 사용해야 한다.
          REPO_LOWER=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          # GitHub Container Registry에 저장할 이미지 주소.
          IMAGE_NAME="ghcr.io/${REPO_LOWER}"

          # 이번 실행이 검사·빌드하는 커밋 번호의 앞 7자리.
          # 어떤 코드로 만든 이미지인지 추적할 수 있게 한다.
          IMAGE_TAG="${GITHUB_SHA:0:7}"

          # 다음 단계에서 사용할 수 있도록 값을 전달한다.
          # steps.image.outputs.name / tag / ref로 참조할 수 있다.
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          # GitHub Actions 로그에 완성된 이미지 주소를 표시한다.
          echo "빌드할 이미지: ${IMAGE_NAME}:${IMAGE_TAG}"
            # GitHub의 이미지 저장소(GHCR)에 로그인한다.
      - name: GHCR 로그인
        shell: bash

        # 이 단계에서만 사용할 환경변수.
        # GitHub가 자동 제공하는 임시 토큰을 사용한다.
        # 개인 토큰이나 비밀번호를 파일에 직접 적지 않는다.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          # 토큰을 표준입력으로 전달해 로그인한다.
          # --password-stdin은 비밀번호를 명령 인자로 직접 넣지 않는 방식이다.
          # GITHUB_ACTOR는 이 실행을 시작한 GitHub 사용자 이름이다.
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin
            # 저장소의 Dockerfile을 사용해서 앱 이미지를 만든다.
      - name: 앱 이미지 빌드
        env:
          # 앞의 '이미지 이름과 태그 설정' 단계에서 만든 주소를 가져온다.
          # 예: ghcr.io/cccr-teamproj-02/edr-ai-triage-lab:a1b2c3d
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          # --tag는 완성될 이미지에 이름과 버전 태그를 붙인다.
          # 마지막 점(.)은 현재 저장소 폴더를 빌드 재료로 사용한다는 뜻이다.
          # 기본적으로 이 폴더의 Dockerfile을 읽는다.
          # Dockerfile에 있는 requirements.txt 설치 명령도 빌드 중 실행된다.
          docker build --tag "$IMAGE_REF" .

      # 만들어진 앱 이미지를 GitHub Container Registry에 올린다.
      - name: 앱 이미지 업로드
        env:
          # 빌드할 때 사용한 것과 동일한 이미지 주소를 사용한다.
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          # 앞 단계에서 로그인한 GHCR에 이미지를 업로드한다.
          # 빌드가 실패했다면 이 단계는 기본적으로 실행되지 않는다.
          docker push "$IMAGE_REF"