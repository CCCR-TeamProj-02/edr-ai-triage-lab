# 인프라 1단계: API만 올립니다 (BACKEND=memory 모드였습니다).
# 인프라 3단계부터는 BACKEND=real, 설정은 ConfigMap·Secret에서 받습니다.
# 적용 순서: secrets.sh → 31-config.yaml → 30-postgres.yaml → 이 파일 (Secret이 없으면 CreateContainerConfigError)
#
# 이름표(label)와 포트는 아래 번호끼리 같아야 연결됩니다.
#   ① = ②  Deployment가 관리할 Pod 이름표 = Pod 템플릿에 붙는 이름표
#   ② = ④  Pod 이름표 = Service가 연결할 이름표
#   ③ = ⑤  컨테이너가 듣는 포트 = Service가 Pod로 보내는 포트
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: soc
spec:
  replicas: 1
  # 롤링 업데이트 중에도 기존 파드를 먼저 내리지 않습니다 (인프라 7단계, 깨 보기 7-1).
  # 새 파드가 Ready가 될 때까지 옛 파드가 서비스를 계속 받습니다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api                      # ①
  template:
    metadata:
      labels:
        app: api                    # ②
    spec:
      # GHCR 패키지가 private이라 이미지를 받으려면 인증이 필요합니다. 이 Secret은 git에 올리지 않고
      # 명령으로 클러스터에만 만듭니다 (kubectl create secret docker-registry ghcr-pull ...).
      # 빠뜨리면 ErrImagePull ... unauthorized (깨 보기 1-2)
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/cccr-teamproj-02/edr-ai-triage-lab:ee25bd7   # CI가 만든 이미지, 태그 = 커밋 7자리 (7단계). 태그 오타 → ImagePullBackOff (깨 보기 1-1)
          ports:
            - containerPort: 8000   # ③ Dockerfile의 uvicorn --port 8000
          # 3단계부터 설정은 ConfigMap(31-config.yaml), 비밀은 Secret(secrets.sh)에서 받습니다.
          # envFrom은 파드가 시작될 때 한 번만 읽습니다 (바꾸면 rollout restart 필요, 깨 보기 3-4).
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "768Mi" }
          livenessProbe:             # 실패하면 컨테이너 재시작. 프로세스가 살아 있는지만 봅니다.
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:            # 실패하면 트래픽만 끊습니다 (재시작 안 함)
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: soc
spec:
  type: ClusterIP
  selector:
    app: api                        # ④
  ports:
    - port: 80                      # Service가 받는 포트 (port-forward svc/api 8000:80)
      targetPort: 8000              # ⑤ Pod로 보낼 포트
