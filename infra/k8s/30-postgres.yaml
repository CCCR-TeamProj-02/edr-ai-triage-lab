# 인프라 3단계: Postgres. 에이전트가 사람 승인에서 멈췄다가 이어 가려면 그 상태(체크포인트)를
# 파드 밖에 저장해야 합니다. 그래서 OpenSearch처럼 StatefulSet + PVC로 올립니다.
#
# 비밀번호는 이 파일에 쓰지 않습니다. Secret `app-secrets`(infra/scripts/secrets.sh가 만듦)에서 받습니다.
# 중요: POSTGRES_PASSWORD는 "데이터 디렉터리가 비어 있는 첫 기동"에만 적용됩니다.
#       PVC에 데이터가 이미 있으면 Secret을 바꿔도 DB 안의 비밀번호는 그대로입니다 (깨 보기 3-2).
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: soc
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: soc
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: soc
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: soc
            - name: POSTGRES_DB
              value: soc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            # 볼륨 맨 위에는 lost+found가 있어 initdb가 거부할 수 있으니 하위 폴더를 데이터 디렉터리로 씁니다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "soc", "-d", "soc"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
