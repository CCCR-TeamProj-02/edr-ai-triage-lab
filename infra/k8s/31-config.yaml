# 비밀이 아닌 설정. 비밀(API 키, 비밀번호, DSN)은 Secret `app-secrets`에 있습니다 (infra/scripts/secrets.sh).
#
# envFrom은 "파드가 시작될 때" 한 번만 읽습니다. 이 값을 바꿨으면 파드를 다시 시작해야 반영됩니다:
#   kubectl -n soc rollout restart deploy/api        (깨 보기 3-4)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: soc
data:
  BACKEND: "real"
  CHECKPOINTER: "postgres"
  OPENSEARCH_URL: "http://opensearch:9200"   # Service 이름. localhost가 아닙니다 (깨 보기 3-3)
  # 4단계에서 생성기가 OpenSearch에 데이터를 넣기 전까지는 도구를 mock으로 둡니다
  TELEMETRY_TOOLS: "mock"
  KB_TOOLS: "mock"
  FAKE_LLM: "true"
  CHAT_MODEL: "gpt-4o-mini"
  EMBED_MODEL: "text-embedding-3-small"
  GUARDRAIL_ON_FAIL: "retry"
  PROMPT_VERSION: "v1"
  WORKER_LEASE_SEC: "300"
  PARSE_STRATEGY: "fast"
  CHUNK_MAX_CHARACTERS: "700"
