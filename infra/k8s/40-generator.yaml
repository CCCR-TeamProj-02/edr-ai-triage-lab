apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator
  namespace: soc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generator
  template:
    metadata:
      labels:
        app: generator
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: generator
          image: ghcr.io/hanjyoon01/edr-ai-triage-api:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - soc.simulator.run
            - --loop
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
